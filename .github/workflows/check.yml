name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache-dependency-path: npm-shrinkwrap.json
          cache: npm
      - run: npm run setup
      - run: npm run check
      - run: npm test
