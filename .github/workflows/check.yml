name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24', '26']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache-dependency-path: npm-shrinkwrap.json
          cache: npm
      - run: npm run setup
      - name: Verify current runtime attribution
        run: node scripts/source-run.mjs scripts/notices.ts --check
      - run: npm run check
      - name: Run suite without the large boundary fixture
        run: node scripts/source-run.mjs --test --test-skip-pattern='^entry 20000 is accepted' tests/*.test.ts
      - name: Run the real 20000-entry boundary without competing tests
        run: node scripts/source-run.mjs --test --test-name-pattern='^entry 20000 is accepted' tests/host-performance.test.ts
